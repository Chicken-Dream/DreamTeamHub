<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dream Team Hub</title>
  <meta name="description" content="A collection of projects by the Dream Team.">
  <link rel="canonical" href="https://dreamteamhub.ca/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4891374612985830" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header">
    <!-- Filled in by js/account.js: "Sign in", or the player's name with a menu. -->
    <div id="account" class="account"></div>
    <h1>Dream Team Hub</h1>
    <p class="tagline">A collection of our projects</p>
  </header>
  <main>
    <a class="kofi-button" href="https://ko-fi.com/abtea" target="_blank" rel="noopener"><img src="https://storage.ko-fi.com/cdn/logomarkLogo.png" alt="" class="kofi-button__icon"><span>Support us</span></a>

    <!-- The plaza is the walk-around lobby for every game below, so it gets a banner rather than a card. -->
    <a class="plaza-banner" href="https://io.dreamteamhub.ca/">
      <div class="plaza-banner__media">
        <img src="images/projects/plaza.png" alt="" decoding="async">
      </div>
      <div class="plaza-banner__body">
        <span class="plaza-banner__badge">New &middot; multiplayer</span>
        <h2 class="plaza-banner__title">Enter the Battlefield</h2>
        <p class="plaza-banner__text">Run around, Spam Emotes, and Make Friends!</p>
        <span class="plaza-banner__cta">Play now &rarr;</span>
      </div>
    </a>

    <section id="project-grid" class="grid" aria-label="Projects">
      <noscript><p class="empty">Please enable JavaScript to view the projects.</p></noscript>
    </section>

    <!-- Tabs and table filled in by js/leaderboard.js. -->
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <h2 id="leaderboard-title" class="leaderboard__title">Leaderboard</h2>
      <div id="leaderboard-tabs" class="leaderboard__tabs" role="tablist" aria-label="Game"></div>
      <div id="leaderboard-panel" class="leaderboard__panel" role="tabpanel"></div>
      <p class="leaderboard__note">Only matches between two signed-in players count.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Dream Team Hub &middot; <a href="privacy.html">Privacy</a></p>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
  <script src="js/account.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
